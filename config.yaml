# 운영 설정 — 코드를 건드리지 않고 바꿀 수 있는 값만 모은다.
# 편집 기준(독자·중요도 문장·제외 조건)은 audience.yaml, 비밀값은 .env 에 둔다.

run:
  store_dir: store                 # metrics.jsonl 과 로컬 캐시(store/cache, Git 제외)가 쌓이는 곳

llm:
  base_url: https://api.openai.com/v1     # OpenAI 호환 서버면 주소만 바꿔 쓸 수 있다
  api_key_env: OPENAI_API_KEY
  models:                          # 단계별로 다른 모델을 쓸 수 있게 분리해 둔다
    select: gpt-4o-mini
    report: gpt-4o-mini
    verify: gpt-4o-mini
  temperature: 0
  timeout_s: 60
  max_retries: 2
  request_limit: 65                # 실패·재시도 포함 실제 요청 누적 상한. 장부 초기화·자동 증액 금지

collect:
  hours: 48                        # 수집 창. 블로그류는 주 3~6건이라 24시간이면 후보가 얇다
  per_source_cap: 12               # 소스당 최신 N건까지만 (한 소스가 후보를 도배하지 못하게)
  min_body_chars: 600              # 본문이 이보다 짧으면 요약하지 않는다 (강의 3강 G1 기준, >= 로 통일)
  body_max_chars: 6000             # 요약 생성과 검수가 같은 길이를 본다 (강의 기본 코드는 6000 vs 5000)
  request_timeout_s: 20
  user_agent: "newsletter-agent-course/0.1 (personal learning project)"
  excluded_hosts:                  # 과제 규정상 제외 6곳. 어떤 경로로 들어와도 걸러낸다
    - openai.com
    - deepmind.google
    - techcrunch.com
    - theverge.com
    - technologyreview.com
    - aitimes.com
  # 채택 근거: REPORT.md 2번 표 / store/source_survey.json (2026-10-29 실측)
  sources:
    - {id: hf_blog,      name: "Hugging Face Blog",        route: rss,         tier: 1, lang: en, url: "https://huggingface.co/blog/feed.xml"}
    - {id: simonw,       name: "Simon Willison's Weblog",  route: atom,        tier: 2, lang: en, url: "https://simonwillison.net/atom/everything/"}
    - {id: latent_space, name: "Latent Space",             route: rss,         tier: 2, lang: en, url: "https://www.latent.space/feed"}
    - {id: the_decoder,  name: "The Decoder",              route: rss,         tier: 2, lang: en, url: "https://the-decoder.com/feed/"}
    - {id: gh_langgraph, name: "LangGraph Releases",       route: github_atom, tier: 1, lang: en, url: "https://github.com/langchain-ai/langgraph/releases.atom"}
    - id: hn_algolia
      name: "Hacker News"
      route: api_hn
      tier: 2
      lang: en
      urls:                        # 쿼리 여러 개를 합쳐 한 소스로 본다
        - "https://hn.algolia.com/api/v1/search_by_date?tags=story&query=llama.cpp&hitsPerPage=30"
        - "https://hn.algolia.com/api/v1/search_by_date?tags=story&query=langgraph&hitsPerPage=30"
        - "https://hn.algolia.com/api/v1/search_by_date?tags=story&query=local%20llm&hitsPerPage=30"
    - {id: arxiv_cs_cl_agent, name: "arXiv cs.CL (agent)", route: api_arxiv,   tier: 1, lang: en, url: "https://export.arxiv.org/api/query?search_query=cat:cs.CL+AND+abs:agent&sortBy=submittedDate&sortOrder=descending&max_results=30"}

select:
  batch_size: 20                   # 예선 묶음 크기: 제목+요약 20건 ≈ 3천 토큰. 40건이면 중간 항목을 놓칠 위험이 커진다(강의 5강 listwise 한계)
  prelim_picks: 5                  # 묶음마다 본선에 올릴 건수
  prelim_borderline: 2             # 경계(6·7등)를 기록해 두는 건수 — 예선 기준이 잘 갈렸는지 보는 용도
  final_target: 5                  # 최종 선별 건수 (과제: 3~5건)
  final_min: 3
  final_ask_extra: 3               # 코드 규칙(같은 사건·소스 상한)으로 빠질 것을 대비해 더 받아 둔다
  max_per_source: 2                # 최종 5건 중 한 소스는 최대 2건
  summary_chars_in_listing: 200

verify:
  max_regenerations: 1             # 불합격 시 재생성은 1회까지, 그래도 불합격이면 그 기사는 스킵
  korean_min_ratio: 0.3            # 요약 글자 중 한글 비율이 이보다 낮으면 형식 불합격
  headline_max_chars: 40
  summary_max_chars: 700
  why_max_chars: 220

publish:
  channel: discord
  webhook_env: DISCORD_WEBHOOK_URL
  total_chars_max: 5800            # Discord 한도 6000자에서 여유를 둔다
  title: "AI 에이전트·로컬 LLM 브리핑"
