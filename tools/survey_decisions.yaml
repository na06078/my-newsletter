# 소스 채택·탈락 판정 — store/source_survey.json(2026-10-29 실측)의 숫자를 보고 사람이 내린 결정과 이유.
# 숫자 자체는 tools/render_survey_table.py 가 JSON 에서 읽어 오므로 여기에는 판단과 설명만 적는다.
# 관문: G1 본문 확보(표본 3건 중 2건 이상 600자 이상 추출) · G2 최근성(7일 3건 이상) · G3 자동 접근 허용(robots.txt·HTTP)

hf_blog:
  decision: 채택
  reason: 1차 소스. 오픈 모델·도구의 직접 발표가 실린다. 관문 세 개 통과.
simonw:
  decision: 채택
  reason: 2차 소스. 7일 15건으로 발행 빈도가 가장 높고 모델·도구의 실사용 후기가 많다. 관문 통과.
latent_space:
  decision: 채택
  reason: 2차 소스. AI 엔지니어링 주간 정리. 키워드 일치율이 높은 편(0.42). 관문 통과.
the_decoder:
  decision: 채택
  reason: 2차 소스. 범용 AI 뉴스 보강용. 피드 10건이 전부 72시간 안이라 하루치를 다 담지 못할 수 있다(포화). 관문 통과.
gh_langgraph:
  decision: 채택
  reason: 1차 소스. 독자가 직접 쓰는 도구라 키워드 일치율 1.00. 발행량은 적고(오늘 48시간 창에는 0건) 릴리스 노트는 피드 본문을 우선 쓴다.
hn_algolia:
  decision: 채택
  reason: API 경로. 쿼리 llama.cpp 하나 기준 7일 4건이지만 키워드 일치율 0.75. 운영에서는 쿼리 3개(llama.cpp·langgraph·local llm)를 합친다.
arxiv_cs_cl_agent:
  decision: 채택
  reason: API 경로. 초록(abstract)이 응답에 들어 있어 본문 확보가 확실하다. 논문 위주라 선별에서 걸러질 가능성이 높아 소스당 상한을 둔다.
langchain_blog:
  decision: 탈락
  reason: HTTP 200 이지만 피드가 아닌 HTML(약 212KB)이 돌아와 항목 0건. 추측한 주소가 틀렸을 수 있으며 대체 주소는 확인하지 못했다.
geeknews:
  decision: 탈락
  reason: 피드는 정상(50건, 24시간 47건)이지만 기사 페이지 표본 3건이 모두 HTTP 403 이라 본문을 받을 수 없다.
reddit_localllama:
  decision: 탈락
  reason: robots.txt 가 자동 접근을 금지(disallowed)한다. 허용되지 않은 접근이라 요청을 보내지 않았다.
amd_rocm_blog:
  decision: 탈락
  reason: 피드 주소가 HTTP 404. 대체 주소는 확인하지 못했다.
gh_rocm:
  decision: 탈락
  reason: 최근 7일 0건, 최신 글이 약 105일 전(2,520시간)이다. 정체된 소스.
gh_llamacpp:
  decision: 탈락
  reason: 피드 10건이 전부 24시간 안이라 하루치를 담지 못한다(포화). 글자 수 관문은 2/3 로 통과했지만 추출문을 직접 열어 보니 변경 설명 한 줄과 빌드 파일 목록·로그인 배너뿐이라 요약할 본문이 아니다(수치와 실제 내용의 괴리).
