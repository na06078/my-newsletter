# 소스 후보 목록 — tools/survey_sources.py 의 입력이다.
# 과제 규정상 제외된 6곳(OpenAI, DeepMind, TechCrunch, The Verge, MIT TR, AI타임스)은 후보에 넣지 않는다.
# route: rss | atom | github_atom | api_hn | api_arxiv
# tier : 1 = 1차 소스(직접 발표), 2 = 2차 소스(취재·분석·모음)

excluded_by_assignment:
  - {name: "OpenAI",     host: "openai.com"}
  - {name: "DeepMind",   host: "deepmind.google"}
  - {name: "TechCrunch", host: "techcrunch.com"}
  - {name: "The Verge",  host: "theverge.com"}
  - {name: "MIT TR",     host: "technologyreview.com"}
  - {name: "AI타임스",    host: "aitimes.com"}

# 키워드 일치율은 '독자 관련도'의 거친 근사치일 뿐이다. 채택 관문이 아니라 참고 수치로만 쓴다.
topic_keywords:
  - llama
  - gguf
  - local llm
  - on-device
  - quantiz
  - inference
  - rocm
  - vulkan
  - amd
  - langgraph
  - langchain
  - agent
  - mcp
  - ollama
  - vllm
  - qwen
  - gemma
  - mistral
  - open-weight
  - open-source
  - lm studio
  - 에이전트
  - 로컬
  - 양자화
  - 오픈소스
  - 추론

candidates:
  - {id: "hf_blog",           name: "Hugging Face Blog",                        route: "rss",         tier: 1, lang: "en", url: "https://huggingface.co/blog/feed.xml"}
