# 편집 기준 — 독자가 누구이고 무엇을 중요하게 보는지.
# 이 파일의 문장은 사용자가 직접 쓰고 고치는 것이 원칙이다.
#
# [상태] importance 는 사용자가 정답 라벨 30건을 단 뒤 Hermes 가 제안한 후보 중에서 골랐다.
#        persona / exclude / tone 은 파이프라인을 돌려 보려고 Hermes 가 채운 "임시 초안"이며,
#        사용자의 문장으로 교체되면 status 를 바꾼다.
status: "importance 는 사용자 선택(Hermes 가 라벨 30건에서 만든 후보 3개 중 2026-10-29 선택). persona·exclude·tone 은 Hermes 임시 초안"

persona: >
  Windows PC와 AMD GPU에서 llama.cpp로 로컬 LLM을 돌리고, LangGraph로 에이전트 워크플로를
  직접 실습하는 개발 학습자. 매일 아침 10분 안에 읽고, 오늘 참고할 소식을
  빠르게 고르고 싶다.

importance: >
  AI 에이전트·LLM을 만들거나 쓰는 개발자에게 직접 관련된 소식이면 중요하다. 새 모델 공개,
  에이전트·코딩 에이전트 설계와 실사용 후기, 로컬 실행, LLM 평가·메모리 같은 연구처럼
  내 실습에 참고할 수 있는 것.

exclude:
  - 발표 예정이거나 로드맵만 있고 지금 쓸 수 있는 것이 없는 소식
  - 투자 유치, 제휴(MOU), 수상 같은 홍보성 소식
  - 이미 널리 알려진 개념을 다시 설명하는 입문 글

tone: "~합니다체, 과장 없이 건조하게. '주목된다', '기대를 모은다' 같은 기자체 표현은 쓰지 않는다."

# 검수 기준 — 요약본이 원문과 어긋나는지 판단할 때 LLM 검수자에게 추가로 알려 주는 규칙.
# 여기에 문장을 더하거나 고치면 검수 엄격도가 바뀐다. (사용자가 직접 수정해 볼 곳)
verification_criteria:
  - headline 과 summary 의 숫자·고유명사·날짜·주체는 원문에 근거가 있어야 한다.
  - 번역, 단위 환산, 표기 차이(예 three months = 3개월)는 문제가 아니다.
  - 원문보다 강한 표현(최초, 압도적, 대폭 등)을 쓰면 과장으로 본다.
  - why 는 독자 관점의 해석을 허용하지만, 원문에 없는 새 사실이나 수치를 단정하면 문제다.
